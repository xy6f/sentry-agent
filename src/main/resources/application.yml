# sentry-agent 配置。被监控系统=项目二 judge-service；工具 mock/真实 HTTP/真实文件混合实现。
# 无 OPENAI_API_KEY 的本机演示与全部单测走默认值即可（llm.enabled=false、watchman.enabled=false）。
server:
  port: 8084

spring:
  application:
    name: sentry-agent
  # Phase 4 事件持久化：默认启用本地 MySQL（schema.sql 幂等建表）。
  # 单测/无 DB 环境用 SENTRY_PERSISTENCE=false 关闭（PersistenceConfig 按开关装配）。
  datasource:
    url: jdbc:mysql://localhost:3306/sentry_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  sql:
    init:
      mode: always           # schema.sql 幂等（IF NOT EXISTS），启动安全执行
      schema-locations: classpath:schema.sql

# Phase 3/4 能力开关集中区（全部默认关 = 零依赖演示形态不变）
sentry:
  persistence:
    enabled: ${SENTRY_PERSISTENCE:true}   # 事件落库开关；false = 纯内存
  notify:
    # Phase 1 通知总开关：默认关；生产配 webhook 后打开（渠道明细见 notify.*）
    enabled: ${SENTRY_NOTIFY_ENABLED:false}
    feishu:
      enabled: ${SENTRY_FEISHU_ENABLED:false}
      webhook: ${SENTRY_FEISHU_WEBHOOK:}
    wecom:
      enabled: ${SENTRY_WECOM_ENABLED:false}
      webhook: ${SENTRY_WECOM_WEBHOOK:}
    sms:
      enabled: ${SENTRY_SMS_ENABLED:false}
      phone-whitelist: ${SENTRY_SMS_PHONES:}
  docker:
    # Phase 3 真自愈：默认关（写工具走 MOCK 文案）；生产按 docs/DEPLOY.md 开启
    enabled: ${SENTRY_DOCKER_ENABLED:false}
    managed-label: sentry-managed
    timeout-seconds: 30
  # 被守护系统的基础地址（mini-judge 走网关 8080）
  target-base-url: http://localhost:8080
  # LLM 总开关：默认 false —— 冒烟与单测走 MockDiagnoserGateway（剧本回包，零网络）。
  # 置 true 且配好 api-key/base-url/model 即切到 ProdDiagnoserGateway 真实链路，图零改动。
  llm:
    enabled: false
    api-key: ${OPENAI_API_KEY:sk-local-dev-placeholder}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: gpt-4o-mini
  # 反思回环与成本护栏（计划书 3.2：确定性兜底优先于模型能力）
  max-verify-loops: 3
  # 全局步数上限：节点每执行一步 STEPS+1，verifyRouter 见 steps>=max-steps 无条件 escalate
  max-steps: 24
  token-budget-per-incident: 50000
  # 读工具 fetchServiceLogs 的真实文件参数（seed-logs 写、fetch 读，同用这两项）
  logs-dir: ./logs
  logs-tail-lines: 50
  # dev 辅助接口开关（POST /api/dev/seed-logs）。生产部署置 false 整体摘除
  dev-api:
    enabled: true
  # Watchman 自动巡检：默认关——未部署 mini-judge 时轮询必失败会疯狂建事件。
  # 多服务多规则（Phase 2）：rules 列表可选，空=默认规则（judge-service 队列，旧行为兼容）。
  # 规则形态见 com.sentryagent.watchman.WatchmanRule 类注释（http-probe/prometheus/log-keyword）。
  watchman:
    enabled: false
    poll-interval-ms: 5000      # 轮询周期：上次结束起算（fixedDelay）
    queue-threshold: 200        # queueDepth 超过即记一次异常（计划书剧本告警线）
    consecutive-times: 3        # 同一服务连续异常次数阈值，达到自动建事件
    cooldown-ms: 300000         # 触发后 5 分钟内同服务不再重复建事件（防自我 DDoS）
  # SSE 进度流（GET /api/incidents/{id}/stream）：补发+轮询参数
  sse:
    poll-interval-ms: 400
    timeout-ms: 120000

logging:
  level:
    com.sentryagent: debug
