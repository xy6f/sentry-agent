# 测试专用配置（Phase 4 落库引入数据源后需要）。
# 语义与 01 项目同名文件一致：密码同源取值，环境变量缺失时回退占位。
# 注意：依赖 DB 的 @SpringBootTestWithMysql 用例（端到端 Mock 链等 9 类 16 用例）
# 的数据源优先级为三级回退（不足清单第 8 项"CI 无 DB 化"改造）：
#   1. Testcontainers 容器（Docker 可用时 @DynamicPropertySource 动态覆盖，
#      见 com.sentryagent.support.SpringBootTestWithMysql）；
#   2. 本机 MySQL 回退——即下面这段 localhost 配置（url 缺省继承 application.yml）；
#   3. 两者皆无 → RequiresDockerCondition 判定整类 SKIP（SKIP 不等于 FAIL，
#      纯逻辑用例照常执行，构建保持绿；矩阵说明见 docs/CI.md）。
spring:
  datasource:
    # 本机回退 url：缺省 localhost:3306（与生产同构）。模拟"MySQL 不可达"验收
    # 场景 b/c 时经环境变量 SPRING_DATASOURCE_URL 指向死端口即可——第四批自测
    # 抓到原实现把死端口 3399 写死在这里，环境 a（Docker 关+本机 MySQL）下
    # Testcontainers 失败回退时必然 Connection refused，属验收配置污染主路径的缺陷。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sentry_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:${CHANGEME_FALLBACK:changeme}}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# 单测兼容：关掉"重启播种 idGen"——端到端用例硬编码"context 首个事件 id=1"，
# 打开播种后首个事件号会跳到 DB 底账之上（MaxStepsGuardTest 等用 1L 直取快照会 NPE）。
# 生产/演示默认 true（application.yml 缺省即开）：重启后新事件从 DB 底账之上继续发号。
sentry:
  persistence:
    seed-id-from-db: false
  # 单测兼容（任务 A）：既有 @SpringBootTest 用例（端到端/契约/幂等/护栏）在同服务
  # judge-service 上连发建事件，进行中去重会把它们判成 BUSY_DUPLICATE——测试口径
  # 与旧行为一致（不去重），防线语义由 IncidentConcurrencyGuardTest 独立验收。
  # 并发上限不覆盖（默认 3）：现有用例均为串行建单，终态即归还配额，互不影响。
  incident:
    dedupe:
      enabled: false
